services:
  backend:
    build: .
    container_name: nozomi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: JDBC:postgresql://localhost:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: nozomi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nozomi_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  
