spring:
  application:
    name: nozomi

  datasource:
    url: JDBC:postgresql://localhost:5432/${POSTGRES_DB:nozomi_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true